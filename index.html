<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Evita flash de tema errado: aplica preferência salva antes do primeiro paint -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>

    <!-- Primary SEO -->
    <title>Geovanna Moura — Desenvolvedora Web Frontend</title>
    <meta name="description" content="Desenvolvedora web com 4+ anos de experiência. Crio sites performáticos, responsivos e que convertem. React, TypeScript, UI/UX. 57+ projetos entregues com nota 5.0." />
    <meta name="author" content="Geovanna Moura" />
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="beSsJSaxVbbBx5XRdPLIaOG9-L1oTYlG6cmtefdytVg" />
    <link rel="canonical" href="https://geovannamoura.com.br/" />

    <!-- Open Graph (redes sociais) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Geovanna Moura — Desenvolvedora Web Frontend" />
    <meta property="og:description" content="Crio sites performáticos, responsivos e que convertem. React, TypeScript, UI/UX. 57+ projetos com avaliação 5.0." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Geovanna Moura — Desenvolvedora Web Frontend" />
    <meta name="twitter:description" content="Sites performáticos, responsivos e que convertem. React, TypeScript, UI/UX." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
